<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<script>(function(){var d=document.documentElement;try{var s=localStorage.getItem("valetkey-theme");if(s==="light"||s==="dark")d.dataset.theme=s}catch(e){}})()</script>
<style>
:root,:root[data-theme="light"]{color-scheme:light;
--bg:#f7f4ef;--surface:#fff;--sunken:#f1ece4;--text:#1f1a14;--muted:#5c5348;--line:#e3ddd3;--edge:#857b6e;
--accent:#f2a93b;--on-accent:#1f1a14;--accent-edge:#b26a00;
--danger:#9e2216;--ok-bg:#e5f1e8;--ok-fg:#1c5531;--bad-bg:#fbe8e5;--bad-fg:#8c1c12;--dry-bg:#fcefd2;--dry-fg:#6e3d00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#15120e;--surface:#1f1b16;--sunken:#2a251e;--text:#f2ece3;--muted:#b5ab9c;--line:#38322a;--edge:#857b6e;
--accent:#f5b54a;--on-accent:#1f1a14;--accent-edge:#f5b54a;
--danger:#f7b6ab;--ok-bg:#1d3325;--ok-fg:#a9ddb9;--bad-bg:#3d1e19;--bad-fg:#f7b6ab;--dry-bg:#3a2b10;--dry-fg:#f6c870}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#15120e;--surface:#1f1b16;--sunken:#2a251e;--text:#f2ece3;--muted:#b5ab9c;--line:#38322a;--edge:#857b6e;
--accent:#f5b54a;--on-accent:#1f1a14;--accent-edge:#f5b54a;
--danger:#f7b6ab;--ok-bg:#1d3325;--ok-fg:#a9ddb9;--bad-bg:#3d1e19;--bad-fg:#f7b6ab;--dry-bg:#3a2b10;--dry-fg:#f6c870}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:break-word}
code,pre,kbd,.mono,textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.875em}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;padding:12px 0}
.mark{font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--text);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;border-top:1px solid var(--line);padding:2px 0;margin-bottom:28px}
.nav a{color:var(--text);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 10px;border-radius:8px}
.nav a:first-child{margin-left:-10px}
.nav a:hover{background:var(--sunken)}
.nav a[aria-current="page"]{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.nav .who{margin-left:auto;color:var(--muted);font-size:14px;min-width:0;overflow-wrap:anywhere;padding:0 10px}
main{padding-bottom:48px}
h1{font-size:clamp(24px,5vw,30px);line-height:1.2;letter-spacing:-.015em;margin:0 0 8px;text-wrap:balance}
h2{font-size:18px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 24px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card > :first-child{margin-top:0}
.card > :last-child{margin-bottom:0}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:2px 0 6px}
a{color:var(--text);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
code{background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
pre{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0 16px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
pre:last-child{margin-bottom:0}
pre.key{border:2px solid var(--accent-edge);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--edge);background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-edge)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.small{min-height:44px;padding:0 12px;font-weight:500;font-size:14px}
.btn[hidden]{display:none}
.btn[aria-busy="true"]{cursor:progress;opacity:.85}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
:focus-visible{outline:3px solid var(--text);outline-offset:2px}
label,legend{display:block;font-weight:600;margin:18px 0 4px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.check.spaced{margin-top:12px}
input,select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--edge);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
textarea{min-height:96px;line-height:1.45}
::placeholder{color:var(--muted);opacity:1}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;font-weight:400}
.check input{width:20px;min-height:0;height:20px;flex:none;accent-color:var(--accent-edge)}
.rows{list-style:none;margin:8px 0 0;padding:0}
.rows > li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:12px 0;border-top:1px solid var(--line)}
.rows > li:first-child{border-top:0}
.rows .what{min-width:0;flex:1 1 220px}
.meta{color:var(--muted);font-size:14px}
.state{font-weight:600}
.state.on{color:var(--ok-fg)}
.writes{display:inline-block;font-size:13px;font-weight:600;color:var(--danger);border:1px solid currentColor;border-radius:6px;padding:0 6px;margin-left:4px}
.outcome{display:inline-block;padding:1px 8px;border-radius:6px;font-size:13px;font-weight:600;background:var(--sunken);color:var(--text)}
.outcome.ok{background:var(--ok-bg);color:var(--ok-fg)}
.outcome.refused,.outcome.error{background:var(--bad-bg);color:var(--bad-fg)}
.outcome.dry_run{background:var(--dry-bg);color:var(--dry-fg);border:1px solid var(--accent-edge)}
p.error{background:var(--bad-bg);color:var(--bad-fg);border-radius:8px;padding:10px 12px;margin:0 0 12px}
p.notice{background:var(--ok-bg);color:var(--ok-fg);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:12px 0 8px}
.filters > div{flex:1 1 150px;min-width:0}
.filters label{margin:0 0 4px}
.rows > li.call{display:block}
.call .msg{margin:6px 0 0}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted)}
.hero{padding:clamp(40px,10vw,88px) 0 24px;max-width:34em}
.hero h1{font-size:clamp(34px,8vw,52px);letter-spacing:-.025em;margin-bottom:16px}
.hero p{font-size:18px;color:var(--muted);margin:0 0 28px}
@media (prefers-reduced-motion:no-preference){.btn,.nav a{transition:background-color .12s}}
</style>
<script>(function(){var d=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
function cur(){return d.dataset.theme||(mq.matches?"dark":"light")}
document.addEventListener("DOMContentLoaded",function(){
var b=document.querySelector("[data-theme-toggle]");
if(b){var label=function(){b.textContent=cur()==="dark"?"Switch to light":"Switch to dark"};
label();b.hidden=false;if(mq.addEventListener)mq.addEventListener("change",label);
b.addEventListener("click",function(){var n=cur()==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("valetkey-theme",n)}catch(e){}label()})}});
document.addEventListener("submit",function(e){var b=e.submitter,f=e.target;
if(b&&b.dataset.confirm&&!confirm(b.dataset.confirm)){e.preventDefault();return}
if(f.dataset.sent){e.preventDefault();return}
if(b&&b.dataset.busy){f.dataset.sent="1";b.dataset.label=b.textContent;b.textContent=b.dataset.busy;b.setAttribute("aria-busy","true")}});
addEventListener("pageshow",function(){document.querySelectorAll("form[data-sent]").forEach(function(f){delete f.dataset.sent;f.querySelectorAll("[aria-busy]").forEach(function(b){b.textContent=b.dataset.label;b.removeAttribute("aria-busy")})})})})()</script>
