<script>(function(){var d=document.documentElement;try{var s=localStorage.getItem("valetkey-theme");if(s==="light"||s==="dark")d.dataset.theme=s}catch(e){}})()</script>
<style>
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(/fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600 700;font-display:swap;src:url(/fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-display:swap;src:url(/fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Spline Sans Mono";font-weight:400;font-display:swap;src:url(/fonts/spline-sans-mono-latin-400-normal.woff2) format("woff2")}
:root,:root[data-theme="light"]{color-scheme:light;
--bg:#eef2f5;--field:#e1e8ee;--raised:#fff;--ink:#10233a;--soft:#34475d;--muted:#4f6074;--edge:#6f8296;--ring:#9aa9b8;--shade:rgba(16,35,58,.14);
--accent:#ff8a4c;--on-accent:#1b1206;--accent-soft:#ffe1cf;--accent-ink:#5a2306;
--key-off:#d3dde6;--key-off-ink:#34475d;--danger:#a3271a;
--ok-bg:#d9efe2;--ok-fg:#174f31;--bad-bg:#fbe0dc;--bad-fg:#8c1c12;--dry-bg:#ffe6d4;--dry-fg:#6b2c08}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0d1520;--field:#16212f;--raised:#1c2939;--ink:#e8eef5;--soft:#c0ccd9;--muted:#97a7b8;--edge:#7d8fa3;--ring:#4d5e72;--shade:rgba(0,0,0,.45);
--accent:#ff9a62;--on-accent:#1b1206;--accent-soft:#3a2214;--accent-ink:#ffd9c2;
--key-off:#223042;--key-off-ink:#c0ccd9;--danger:#f5ada1;
--ok-bg:#163626;--ok-fg:#9fe0b3;--bad-bg:#3a1c19;--bad-fg:#f5ada1;--dry-bg:#3a2214;--dry-fg:#ffc29a}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0d1520;--field:#16212f;--raised:#1c2939;--ink:#e8eef5;--soft:#c0ccd9;--muted:#97a7b8;--edge:#7d8fa3;--ring:#4d5e72;--shade:rgba(0,0,0,.45);
--accent:#ff9a62;--on-accent:#1b1206;--accent-soft:#3a2214;--accent-ink:#ffd9c2;
--key-off:#223042;--key-off-ink:#c0ccd9;--danger:#f5ada1;
--ok-bg:#163626;--ok-fg:#9fe0b3;--bad-bg:#3a1c19;--bad-fg:#f5ada1;--dry-bg:#3a2214;--dry-fg:#ffc29a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:break-word}
h1,h2,.mark,.key-name{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-weight:700}
strong,b{font-weight:600}
code,pre,kbd,.mono,textarea.mono{font-family:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:20px 0}
.mark{font-size:24px;color:var(--ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;margin-right:auto}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--field)}
.nav a{color:var(--ink);text-decoration:none;min-height:40px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px}
.nav a:hover{background:var(--raised)}
.nav a[aria-current="page"]{background:var(--raised);font-weight:600}
.who{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.out{color:var(--muted);font-size:15px;min-height:44px;display:inline-flex;align-items:center;padding:0 6px}
main{padding:24px 0 72px}
h1{font-size:clamp(32px,5vw,44px);line-height:1.05;letter-spacing:-.025em;margin:0 0 12px;text-wrap:balance}
h2{font-size:22px;line-height:1.2;letter-spacing:-.01em;margin:0 0 8px}
.lead{color:var(--soft);margin:0 0 28px;max-width:60ch}
.card{background:var(--raised);border-radius:24px;padding:24px;margin-bottom:16px}
.card > :first-child{margin-top:0}
.card > :last-child{margin-bottom:0}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:15px;margin:2px 0 6px}
a{color:var(--ink);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
code{background:var(--field);border-radius:8px;padding:1px 6px;overflow-wrap:anywhere}
pre{background:var(--field);border-radius:12px;padding:12px 14px;margin:8px 0 16px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
pre:last-child{margin-bottom:0}
pre.key{background:var(--accent-soft);color:var(--accent-ink);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--field);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--ring)}
.card .btn:not(.primary):not(.copy){box-shadow:inset 0 0 0 1px var(--edge);background:transparent}
.card .btn:not(.primary):not(.copy):hover{background:var(--field)}
.btn.primary,.btn.copy{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 22px}
.btn.primary:hover,.btn.copy:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.small{padding:0 14px;font-size:15px}
.btn[hidden]{display:none}
.btn[aria-busy="true"]{cursor:progress;opacity:.85}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label,legend{display:block;font-weight:600;margin:18px 0 4px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.check.spaced{margin-top:12px}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--edge);border-radius:12px;background:var(--raised);color:var(--ink);font:inherit}
textarea{min-height:96px;line-height:1.45}
::placeholder{color:var(--muted);opacity:1}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;font-weight:400}
.check input{width:20px;min-height:0;height:20px;flex:none;accent-color:var(--ink)}
.rows{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.rows > li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:12px 16px;border-radius:20px;background:var(--field)}
.rows .what{min-width:0;flex:1 1 220px}
.meta{color:var(--muted);font-size:15px}
.state{font-weight:600}
.state.on{color:var(--ok-fg)}
.writes,.reads,.diff,.outcome{display:inline-block;font-size:14px;font-weight:600;border-radius:10px;padding:1px 10px;margin-left:4px}
.writes{background:var(--dry-bg);color:var(--dry-fg)}
.reads{background:var(--raised);color:var(--soft)}
.diff.added{background:var(--ok-bg);color:var(--ok-fg)}
.diff.changed{background:var(--dry-bg);color:var(--dry-fg)}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--raised);border-radius:12px;padding:10px 12px;margin:8px 0 0;max-width:65ch}
.check.choice{align-items:flex-start;padding:8px 0}
.check.choice input{margin-top:3px}
.outcome{margin-left:0;background:var(--raised);color:var(--ink)}
.outcome.ok{background:var(--ok-bg);color:var(--ok-fg)}
.outcome.refused,.outcome.error{background:var(--bad-bg);color:var(--bad-fg)}
.outcome.dry_run{background:var(--dry-bg);color:var(--dry-fg)}
p.error{background:var(--bad-bg);color:var(--bad-fg);border-radius:12px;padding:10px 14px;margin:0 0 12px}
p.notice{background:var(--ok-bg);color:var(--ok-fg);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:12px 0 8px}
.filters > div{flex:1 1 150px;min-width:0}
.filters label{margin:0 0 4px}
.rows > li.call{display:block}
.call .msg{margin:6px 0 0}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted)}
.hero{padding:clamp(40px,10vw,88px) 0 24px;max-width:34em}
.hero h1{font-size:clamp(44px,9vw,72px);letter-spacing:-.03em;margin-bottom:18px}
.hero p{font-size:19px;color:var(--soft);margin:0 0 28px}
/* home: the keyring */
.hello{display:flex;flex-wrap:wrap;gap:40px 64px;align-items:center;margin-bottom:56px}
.hello > div{flex:1 1 380px;min-width:0}
.hello h1{font-size:clamp(40px,6vw,64px);line-height:1;letter-spacing:-.03em;margin-bottom:16px}
.addr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 8px 8px 20px;border-radius:999px;background:var(--raised);box-shadow:0 1px 2px var(--shade);max-width:560px}
@media (max-width:560px){.addr{border-radius:24px;padding:14px 16px}.addr .btn{width:100%}}
.addr code{flex:1 1 240px;min-width:0;background:none;padding:0;font-size:15px}
.setup{margin:14px 0 0;padding:0;list-style:none;font-size:15px;color:var(--soft);display:flex;flex-direction:column;gap:6px}
.setup code{font-size:13.5px}
.ring{display:flex;flex-direction:column;align-items:center}
.ring::before{content:"";width:120px;height:120px;border-radius:50%;border:10px solid var(--ring);margin-bottom:-18px;position:relative;z-index:1}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:460px}
.keys li{display:flex;flex-direction:column;align-items:center;transform:rotate(var(--tilt))}
.keys li::before{content:"";width:4px;height:var(--cord);background:var(--ring);border-radius:2px}
.keys li:nth-child(5n+1){--tilt:-6deg;--cord:18px}
.keys li:nth-child(5n+2){--tilt:-2deg;--cord:34px}
.keys li:nth-child(5n+3){--tilt:3deg;--cord:24px}
.keys li:nth-child(5n+4){--tilt:7deg;--cord:40px}
.keys li:nth-child(5n){--tilt:-4deg;--cord:14px}
.key{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:116px;padding:16px 10px 14px;border-radius:40px 40px 18px 18px;outline-offset:4px;text-align:center}
.key::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--bg)}
.key.on{background:var(--ink);color:var(--bg);box-shadow:0 6px 14px var(--shade)}
.key.off{background:var(--key-off);color:var(--key-off-ink);box-shadow:inset 0 0 0 2px var(--edge)}
.key-name{font-size:19px;line-height:1.1}
.key-act{font-size:14px;font-weight:600}
.ring .note{margin:18px 0 0;font-size:15px;color:var(--muted);text-align:center;max-width:36ch}
.opened{background:var(--field);border-radius:36px;padding:clamp(20px,4vw,40px);margin-bottom:20px}
.opened .rows > li{background:var(--raised)}
.opened .rows code{background:none;padding:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.head h2{margin:0}
.more{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.more a{flex:1 1 300px;text-decoration:none;border-radius:36px;padding:28px;background:var(--field);display:flex;flex-direction:column;gap:6px}
.more a.spare{background:var(--accent-soft);color:var(--accent-ink)}
.more strong{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-weight:700;font-size:24px;letter-spacing:-.01em}
@media (prefers-reduced-motion:no-preference){.btn,.nav a,.key{transition:background-color .12s,filter .12s}}
</style>
<script>(function(){var d=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
function cur(){return d.dataset.theme||(mq.matches?"dark":"light")}
document.addEventListener("DOMContentLoaded",function(){
var b=document.querySelector("[data-theme-toggle]");
if(b){var label=function(){b.textContent=cur()==="dark"?"Light mode":"Dark mode"};
label();b.hidden=false;if(mq.addEventListener)mq.addEventListener("change",label);
b.addEventListener("click",function(){var n=cur()==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("valetkey-theme",n)}catch(e){}label()})}
document.querySelectorAll("[data-copy]").forEach(function(c){var src=document.getElementById(c.dataset.copy);if(!src||!navigator.clipboard)return;c.hidden=false;
c.addEventListener("click",function(){navigator.clipboard.writeText(src.textContent).then(function(){c.textContent="Copied"},function(){})})})});
document.addEventListener("submit",function(e){var b=e.submitter,f=e.target;
if(b&&b.dataset.confirm&&!confirm(b.dataset.confirm)){e.preventDefault();return}
if(f.dataset.sent){e.preventDefault();return}
if(b&&b.dataset.busy){f.dataset.sent="1";b.dataset.label=b.textContent;b.textContent=b.dataset.busy;b.setAttribute("aria-busy","true")}});
addEventListener("pageshow",function(){document.querySelectorAll("form[data-sent]").forEach(function(f){delete f.dataset.sent;f.querySelectorAll("[aria-busy]").forEach(function(b){b.textContent=b.dataset.label;b.removeAttribute("aria-busy")})})})})()</script>
